name: Flutter Build & RuStore Publish

# Триггеры запуска workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную через кнопку "Run workflow" в GitHub Actions

jobs:
  build:
    name: Build APK and Publish
    runs-on: ubuntu-latest # Виртуальная машина на базе Ubuntu Linux

    steps:
      # Шаг 1: Клонирование репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установка JDK (Java Development Kit), необходим для сборки Android Gradle
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Шаг 3: Установка Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Шаг 4: Генерация или обновление платформенных файлов (Android/Gradle)
      - name: Generate or update platform files
        run: flutter create . --org com.klixim

      # Шаг 5: Загрузка зависимостей pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get

      # Шаг 6: Сборка релизного APK
      - name: Build Android Release APK
        run: flutter build apk --release

      # Шаг 7: Сохранение собранного APK в артефакты GitHub Actions
      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Шаг 8: Создание GitHub Release (срабатывает, если был запушен git tag, например v1.0.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 9: Отправка APK в RuStore (при наличии настроенных секретов)
      - name: Publish to RuStore
        if: env.RUSTORE_KEY_ID != '' && env.RUSTORE_PRIVATE_KEY != ''
        continue-on-error: true
        uses: Suro4ek/rustore-action@v1
        with:
          key_id: ${{ secrets.RUSTORE_KEY_ID }}
          private_key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          application_id: 'com.klixim.new_flutter_repo'
          file: 'build/app/outputs/flutter-apk/app-release.apk'
          whats_new: 'Первый релиз приложения в RuStore!'
          publish_type: 'MANUAL'
          submit: 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}

      # Шаг 10: Уведомление, если секреты RuStore еще не добавлены
      - name: RuStore publication notice
        if: env.RUSTORE_KEY_ID == '' || env.RUSTORE_PRIVATE_KEY == ''
        run: |
          echo "=========================================================="
          echo "ИНФОРМАЦИЯ: Секреты для RuStore еще не заданы в репозитории."
          echo "Сборка APK успешно завершена и сохранена в GitHub Artifacts!"
          echo "Чтобы отправлять файл в RuStore автоматически:"
          echo "1. Перейдите в Settings -> Secrets and variables -> Actions"
          echo "2. Добавьте RUSTORE_KEY_ID и RUSTORE_PRIVATE_KEY"
          echo "=========================================================="
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
